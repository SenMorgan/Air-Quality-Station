; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; -----------------------------------------------------------------------
; Do not modify below this line, use platformio_override.ini instead
[env]
build_flags =
  	'-DWIFI_SSID=""'
    '-DWIFI_PASSWD=""'
    '-DMQTT_SERVER=""'
    '-DMQTT_SERVER_PORT=0'
    '-DHOSTNAME=""'
    '-DMQTT_LOGIN=""'
    '-DMQTT_PASSWORD=""'
    '-DOTA_HOSTNAME=""'
    '-DOTA_PASSWORD=""'

[platformio]
extra_configs =
    platformio_override.ini
; End of «do not modify» section
; -----------------------------------------------------------------------

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 512000
board_build.flash_mode = dout
lib_deps =
	knolleary/PubSubClient@^2.8
	boschsensortec/BSEC Software Library@^1.8.1492
; Moves the precompiled BSEC library from IRAM to flash, see the script
extra_scripts = post:scripts/bsec_irom.py

; Same firmware as d1_mini, uploaded over the air
[env:d1_mini-OTA]
extends = env:d1_mini
upload_protocol = espota
upload_port = Air-Quality-Station
upload_flags =
	--port=8266
;	--auth=****
